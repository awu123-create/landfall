spring:
  application:
    name: landfall-backend
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:landfall}
    username: ${POSTGRES_USER:landfall}
    # detect-secrets Secret Keyword 误报：仅本地 docker-compose 默认回退口令，生产环境通过 POSTGRES_PASSWORD 覆盖。
    password: ${POSTGRES_PASSWORD:landfall123} # pragma: allowlist secret
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3s
      connect-timeout: 3s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  type-handlers-package: com.landfall.common.persistence
  global-config:
    banner: false
    db-config:
      id-type: input

server:
  port: ${SERVER_PORT:8080}

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

landfall:
  pagination:
    default-size: 20
    max-size: 100
