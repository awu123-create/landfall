spring:
  application:
    name: landfall-backend
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:landfall}
    username: ${POSTGRES_USER:landfall}
    # detect-secrets Secret Keyword 误报：仅本地 docker-compose 默认回退口令，生产环境通过 POSTGRES_PASSWORD 覆盖。
    password: ${POSTGRES_PASSWORD:landfall123} # pragma: allowlist secret
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3s
      connect-timeout: 3s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  type-handlers-package: com.landfall.common.persistence
  global-config:
    banner: false
    db-config:
      id-type: input

server:
  port: ${SERVER_PORT:8080}

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

landfall:
  pagination:
    default-size: 20
    max-size: 100
  auth:
    permission-cache-ttl: 30m
    bootstrap-admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
      username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
      email: ${BOOTSTRAP_ADMIN_EMAIL:admin@landfall.local}
      # detect-secrets Secret Keyword 误报：仅本地开发默认超级管理员初始口令，生产环境关闭 bootstrap-admin 或通过环境变量覆盖。
      password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin123456} # pragma: allowlist secret
      nickname: ${BOOTSTRAP_ADMIN_NICKNAME:系统管理员}

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 604800
  active-timeout: -1
  is-concurrent: true
  is-share: false
  is-read-header: true
  is-read-body: false
  is-read-cookie: false
  auto-renew: false
  is-log: false
  is-print: false
