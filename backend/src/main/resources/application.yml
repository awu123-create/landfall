spring:
  application:
    name: landfall-backend
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]

server:
  port: ${SERVER_PORT:8080}

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

landfall:
  pagination:
    default-size: 20
    max-size: 100
