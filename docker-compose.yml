services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-landfall}
      POSTGRES_USER: ${POSTGRES_USER:-landfall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-landfall123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - landfall_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-landfall} -d ${POSTGRES_DB:-landfall}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - landfall_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

volumes:
  landfall_pg_data:
  landfall_redis_data:
