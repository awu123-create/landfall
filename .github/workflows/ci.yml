name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Check docs links and pointers
        run: make check-docs

      - name: Check Flyway migration naming and immutability
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/check-migrations.py --base "origin/${{ github.base_ref }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            python3 scripts/check-migrations.py --base "${{ github.event.before }}"
          else
            make check-migrations
          fi

      - name: Lint, test, and package backend
        run: make backend-verify

  integration-test:
    name: Integration Tests (PostgreSQL 16 + Redis 7)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: landfall
          POSTGRES_USER: landfall
          # detect-secrets Secret Keyword 误报：仅为 CI 临时服务容器内网测试口令，非真实密钥。
          POSTGRES_PASSWORD: landfall123 # pragma: allowlist secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U landfall -d landfall"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend integration tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: landfall
          # detect-secrets Secret Keyword 误报：对应上方 CI 临时 PostgreSQL 容器的默认测试口令。
          POSTGRES_PASSWORD: landfall123 # pragma: allowlist secret
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
        run: make backend-it
